# Build & deploy on the Raspberry Pi via its self-hosted runner.
# Push to main -> tests run inside the image -> stack is (re)built and restarted.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted        # narrow to [self-hosted, Linux, ARM64] if you label the runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false          # keep git-ignored config/, .env, data/, applications/

      - name: Show disk + reclaim space
        run: |
          df -h .
          docker system df || true
          # remove stopped containers + dangling images from earlier failed runs
          # (named volume pgdata is NOT touched)
          docker system prune -f

      - name: Build app image
        run: docker compose build app

      - name: Run offline tests (inside the image)
        run: |
          docker compose run --rm --no-deps app python -m tests.test_pipeline
          docker compose run --rm --no-deps app python -m tests.test_storage_upsert
          docker compose run --rm --no-deps app python -m tests.test_scorer
          docker compose run --rm --no-deps app python -m tests.test_new_adapters
          docker compose run --rm --no-deps app python -m tests.test_example_configs
          docker compose run --rm --no-deps app python -m tests.test_werkenvoornederland
          docker compose run --rm --no-deps app python -m tests.test_ingest
          docker compose run --rm --no-deps app python -m tests.test_webapp
          docker compose run --rm --no-deps app python -m tests.test_generator
          docker compose run --rm --no-deps app python -m tests.test_candidate_import
          docker compose run --rm --no-deps app python -m tests.test_generation_schema
          docker compose run --rm --no-deps app python -m tests.test_tailor
          docker compose run --rm --no-deps app python -m tests.test_generation
          docker compose run --rm --no-deps app python -m tests.test_generation_records

      - name: Deploy (images already local — no pull/build here)
        run: docker compose up -d --no-build --pull never

      - name: Prune dangling images and old build cache
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --keep-storage 2GB
