# Build & deploy on the Raspberry Pi via its self-hosted runner.
# Push to main -> tests run inside the image -> stack is (re)built and restarted.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted        # narrow to [self-hosted, Linux, ARM64] if you label the runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false          # keep git-ignored config/, .env, data/, applications/

      - name: Show disk + reclaim space
        run: |
          df -h .
          docker system df || true
          # remove stopped containers + dangling images from earlier failed runs
          # (named volumes pgdata/ollama are NOT touched)
          docker system prune -f

      - name: Pull base images (sequential, with retries)
        env:
          COMPOSE_PARALLEL_LIMIT: "1"   # extract one large layer at a time (kind to the SD card)
        run: |
          set -e
          for svc in db ollama; do
            ok=0
            for i in 1 2 3; do
              echo "::group::pull $svc (attempt $i)"
              if timeout 900 docker compose pull "$svc"; then ok=1; echo "::endgroup::"; break; fi
              echo "::endgroup::"
              echo "pull of $svc failed (attempt $i); retrying in 30s..."
              sleep 30
            done
            if [ "$ok" -ne 1 ]; then
              echo "Could not pull $svc after 3 attempts (check disk space / Docker Hub rate limit)."
              exit 1
            fi
          done

      - name: Build app image
        run: docker compose build app

      - name: Run offline tests (inside the image)
        run: |
          docker compose run --rm --no-deps app python -m tests.test_pipeline
          docker compose run --rm --no-deps app python -m tests.test_storage_upsert
          docker compose run --rm --no-deps app python -m tests.test_scorer

      - name: Deploy (images already local — no pull/build here)
        run: docker compose up -d --no-build --pull never

      - name: Prune dangling images
        run: docker image prune -f
