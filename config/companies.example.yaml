# Example company entries for Part 1 of the source-expansion plan (universities,
# UMCs, research institutes). These are NOT a full companies.yaml -- copy the
# entries you want into your real (git-ignored) config/companies.yaml.
#
# title_include: only links whose title contains one of these keywords get a
#   detail-page fetch at all -- a UMC/university listing can run into the
#   hundreds of vacancies, most of them clinical or academic, not software/IT.
# title_exclude: dropped even if title_include would otherwise match (PhD and
#   clinical roles, per the decided rule-filter excludes below).
# Both filters run before the detail-page fetch and before max_results, so an
# excluded link never costs a request and never eats into the result budget.

companies:
  # SAP SuccessFactors Career Site Builder (`/go/<list>/<id>` URLs). Verified
  # via check_source.py on 2026-11-24 -- see issue #2 for the full
  # per-site findings. The underlying platform also exposes an RSS feed at
  # /services/rss/category/?catid=<id>, confirmed working on all three sites
  # below, but capped at ~10 items -- not used here, the html adapter with the
  # pattern below already gets the full listing.
  - name: TU Delft
    adapter: html
    enabled: true
    params:
      careers_url: "https://careers.tudelft.nl/go/All-jobs/9021002"
      link_pattern: "job/"
      title_include: [software, developer, engineer, data, devops, ict,
                       bioinformatic, programmeur, ontwikkelaar]
      title_exclude: [phd, "ph.d.", promovendus, promotieplek, promotieonderzoek,
                       "doctoral candidate", verpleegkundige, arts, aios, anios,
                       laborant, "physician assistant", anesthesiemedewerker,
                       huisarts, tandarts, basisarts]
      max_results: 40

  # Same platform as TU Delft. HTML-adapter mechanism confirmed (200 OK), but
  # KNAW had zero open positions on 2026-11-24, and the generic listing page
  # has zero job-shaped anchors at all right now -- the "job/" pattern is
  # inferred from TU Delft's identical platform, not directly observed.
  # Disabled until check_source.py confirms real links match. Enable once it
  # does (and once the listing has postings to check against).
  - name: KNAW
    adapter: html
    enabled: false
    params:
      careers_url: "https://vacatures.knaw.nl/go/All-jobs/9635855/"
      link_pattern: "job/"
      title_include: [software, developer, engineer, data, devops, ict,
                       bioinformatic, programmeur, ontwikkelaar]
      title_exclude: [phd, "ph.d.", promovendus, promotieplek, promotieonderzoek,
                       "doctoral candidate", verpleegkundige, arts, aios, anios,
                       laborant, "physician assistant", anesthesiemedewerker,
                       huisarts, tandarts, basisarts]
      max_results: 40

  # Same caveat as KNAW, and worse: the English list id below returns zero
  # job-shaped anchors on 2026-11-24, even though Leiden has open English
  # roles elsewhere -- this id looks wrong, not merely empty right now.
  # Disabled until the correct list id is found and check_source.py confirms
  # real links match. (The Dutch "Alle-vacatures/5491001" id is a dead end
  # too -- it redirects to a session-bound error page on a bare GET, see
  # issue #2.)
  - name: Leiden University
    adapter: html
    enabled: false
    params:
      careers_url: "https://careers.universiteitleiden.nl/go/Engelstalige-vacatures/9653701/"
      link_pattern: "job/"
      title_include: [software, developer, engineer, data, devops, ict,
                       bioinformatic, programmeur, ontwikkelaar]
      title_exclude: [phd, "ph.d.", promovendus, promotieplek, promotieonderzoek,
                       "doctoral candidate", verpleegkundige, arts, aios, anios,
                       laborant, "physician assistant", anesthesiemedewerker,
                       huisarts, tandarts, basisarts]
      max_results: 40

  # Verified 2026-11-24: real vacancy links on the first page, matched by
  # /en/vacancy/<numeric>/. Replaces the old academictransfer entry.
  - name: Erasmus MC
    adapter: html
    enabled: true
    params:
      careers_url: "https://werkenbijerasmusmc.nl/en/vacancies"
      link_pattern: "/en/vacancy/[0-9]+/"
      title_include: [software, developer, engineer, data, devops, ict,
                       bioinformatic, programmeur, ontwikkelaar]
      title_exclude: [phd, "ph.d.", promovendus, promotieplek, promotieonderzoek,
                       "doctoral candidate", verpleegkundige, arts, aios, anios,
                       laborant, "physician assistant", anesthesiemedewerker,
                       huisarts, tandarts, basisarts]
      max_results: 40

  # Verified 2026-11-24: 2 real vacancy links matched by
  # /over-ons/werken-bij-naturalis/<slug>. Replaces the old academictransfer
  # entry.
  - name: Naturalis Biodiversity Center
    adapter: html
    enabled: true
    params:
      careers_url: "https://naturalis.nl/vacatures"
      link_pattern: "/over-ons/werken-bij-naturalis/[a-z0-9-]+$"
      title_include: [software, developer, engineer, data, devops, ict,
                       bioinformatic, programmeur, ontwikkelaar]
      title_exclude: [phd, "ph.d.", promovendus, promotieplek, promotieonderzoek,
                       "doctoral candidate", verpleegkundige, arts, aios, anios,
                       laborant, "physician assistant", anesthesiemedewerker,
                       huisarts, tandarts, basisarts]
      max_results: 40

  # werkenvoornederland.nl (central government jobs site). No RSS/JSON API
  # exists; the adapter reaches the site's own Hippo CMS results component
  # directly -- see the comment above fetch_werkenvoornederland in
  # jobtracker/adapters.py for how, and how to find another organisation's
  # `werkgever` code. Verified 2026-11-24: 14 real RIVM postings, 5 real NFI
  # postings, both server-side filtered (not a client-side/JS-only filter).
  - name: RIVM
    adapter: werkenvoornederland
    enabled: true
    params:
      werkgever: "01760"
      max_results: 40

  - name: NFI
    adapter: werkenvoornederland
    enabled: true
    params:
      werkgever: "01487"
      max_results: 40

