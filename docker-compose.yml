# Full stack for job-tracker: Postgres + the web app.
#
#   docker compose up -d                 # build (if needed) and start everything
#   docker compose logs -f app           # follow the app
#
# The LLM is NOT part of this stack: the app talks to the Ollama instance
# running on the Pi host (same instance CHESHIRE uses), reached via
# host.docker.internal. Pull the model once on the host:
#   ollama pull qwen2.5:3b
# and set OLLAMA_KEEP_ALIVE=30s on the host ollama service so the model is
# unloaded quickly after use to free RAM.
#
# Personal data (config/, .env, applications/) is bind-mounted from this directory,
# NOT baked into the image — see DEPLOY.md.

services:
  db:
    image: postgres:16
    container_name: jobtracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    image: jobtracker-app:latest
    container_name: jobtracker-app
    depends_on:
      db:
        condition: service_healthy
    # Inject everything from .env (API keys etc.) into the container.
    env_file:
      - .env
    # Allows the container to reach the shared Ollama instance on the Pi host.
    # host-gateway resolves to the host's docker bridge IP on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # These override any same-named keys in .env so container networking is correct:
    # the DB is reached by service name, Ollama lives on the host.
    environment:
      LLM_BACKEND: ollama
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-jobtracker}"
    volumes:
      - ./config:/app/config              # setpoints/profile/companies (editable via UI)
      - ./data:/app/data                  # local-JSON fallback (if DB ever unset)
      - ./applications:/app/applications  # generated CV + letters land here
      - ./Solliciteren:/app/Solliciteren:ro  # your example letters (writing style)
    ports:
      - "8000:8000"                       # web UI on http://<pi-ip>:8000
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
