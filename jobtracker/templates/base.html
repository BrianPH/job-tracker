<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-tracker</title>
<style>
  :root { --blue:#1f4e79; --bg:#f5f7fa; --border:#dde3ea; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", sans-serif; margin:0; background:var(--bg); color:#222; }
  header { background:var(--blue); color:#fff; padding:10px 24px; display:flex; align-items:center; gap:24px; }
  header h1 { font-size:18px; margin:0; }
  header a { color:#cfe0f0; text-decoration:none; }
  header a:hover { color:#fff; }
  main { max-width:1200px; margin:20px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { background:#eef2f7; position:sticky; top:0; }
  tr:hover td { background:#f4f8fc; }
  a.job { color:var(--blue); font-weight:600; text-decoration:none; }
  a.job:hover { text-decoration:underline; }
  .badge { display:inline-block; min-width:34px; text-align:center; padding:2px 7px; border-radius:12px; font-weight:700; font-size:12px; color:#fff; }
  .b-high { background:#2e8540; } .b-mid { background:#c9a227; } .b-low { background:#b0413e; } .b-none { background:#8a97a6; }
  .muted { color:#68737f; font-size:12px; }
  .remote { color:#2e8540; font-weight:600; font-size:12px; }
  form.inline { display:inline; }
  select, input[type=text], input[type=number], textarea { padding:6px 8px; border:1px solid var(--border); border-radius:6px; font:inherit; }
  button { padding:6px 12px; border:0; border-radius:6px; background:var(--blue); color:#fff; cursor:pointer; font:inherit; }
  button:hover { filter:brightness(1.15); }
  button.small { padding:3px 9px; font-size:12px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .filelinks a { display:block; font-size:12px; }
  .ok { color:#2e8540; } .err { color:#b0413e; }
  textarea { width:100%; min-height:120px; }
  label b { display:block; margin:12px 0 4px; }
  pre { background:#0f1720; color:#d7e2ec; padding:12px; border-radius:8px; font-size:12px; overflow:auto; max-height:320px; }

  /* --- mobile (phones) --- */
  @media (max-width: 720px) {
    header { padding:10px 14px; flex-wrap:wrap; gap:10px; }
    main { margin:12px auto; padding:0 8px; }
    .card { padding:12px; }
    .filters { flex-direction:column; align-items:stretch; }
    .filters input[type=text], .filters input[type=number], .filters select, .filters button { width:100%; }
    select, input, button { min-height:42px; font-size:15px; }  /* touch targets */
    button.small { min-height:38px; }
    form.scrape-form { float:none !important; margin:10px 0 0 !important; display:block; }
    form.scrape-form button { width:100%; }

    /* table -> stacked cards */
    table, tbody, tr, td { display:block; width:100%; }
    table tr.head { display:none; }
    tr { border:1px solid var(--border); border-radius:8px; margin-bottom:12px; padding:8px 10px; background:#fff; }
    tr:hover td { background:transparent; }
    td { border:none; padding:4px 2px; }
    td[data-label]::before { content:attr(data-label); display:inline-block; min-width:92px;
                             font-weight:600; color:#68737f; font-size:12px; vertical-align:top; }
    td.empty-mobile { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>job-tracker</h1>
  <nav><a href="/">Vacatures</a> &nbsp;|&nbsp; <a href="/settings">Instellingen</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
